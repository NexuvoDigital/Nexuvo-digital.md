$('#nav').innerHTML=NAV.map(n=>`<a href="${n[2]}">${n[k]}</a>`).join('');
$('#mnav').innerHTML=NAV.map(n=>`<a href="${n[2]}">${n[k]}</a>`).join('')+`<a class="btn p" href="#contact">${t.quote}</a>`;spy();
$('#chips').innerHTML=VAL.map(v=>`<span class="chip">${v[k]}</span>`).join('');
$('#svc').innerHTML=SV.map((v,x)=>`<div class="glass card ${SP[x]}">${ic(SI[x])}<h3>${v[k]}</h3><p>${v[k+2]}</p></div>`).join('');
$('#adv').innerHTML=AD.map((a,x)=>`<div class="glass card adv">${ic(AI2[x])}<h3>${a[k]}</h3></div>`).join('');
$('#prc').innerHTML=PR.map(p=>`<div class="glass pr${p[5]?' pop':''}">${p[5]?`<span class="b">${k?'Популярный выбор':'Alegerea populară'}</span>`:''}<h3>${p[0]}</h3><span class="off">-20%</span><div class="pc"><s>${Math.round(p[1]/.8)} €</s><br>${k?'от ':'de la '}${p[1]} €</div><div class="d">${p[2+k]}</div><ul>${p[4].map(x=>`<li>${x[k]}</li>`).join('')}</ul></div>`).join('');
$('#stp').innerHTML=ST.map((s,n)=>`<div class="glass card step"><b>${n+1}</b><h3>${s[k]}</h3><p>${s[k+2]}</p></div>`).join('');
$('#rv').innerHTML=RV.map(r=>`<div class="glass"><div class="st">★★★★★</div><q>${r[2+k]}</q><div class="who"><span class="ava">${r[0][0]}</span><div><b>${r[0]}</b><br><small>${r[1]}</small></div></div></div>`).join('');
$('#faq').innerHTML=FQ.map(f=>`<details><summary>${f[k]}</summary><p>${f[k+2]}</p></details>`).join('');reveal();hx();}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x==b));render()});
$('#mt').innerHTML=[...AI,...AI].map(a=>`<span>${a[0]}</span>`).join('');
$('#pv').onclick=()=>$('#rv').scrollBy({left:-360,behavior:'smooth'});$('#nx').onclick=()=>$('#rv').scrollBy({left:360,behavior:'smooth'});

const o=$('#orb');o.innerHTML=AI.map((a,k)=>`<div class="ic"><img src="${LG[k]}" alt="${a[0]}" width="74" height="74" draggable="false"><b>${a[0]}</b></div>`).join('');
const cs=[...o.children],rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let ang=0,hv=-1;
function pos(){const w=o.clientWidth,h=o.clientHeight,sw=Math.min(380,w),cx=w/2,rx=Math.min(w/2-36,300),cy=h*.37,ry=h*.12,n=cs.length;
cs.forEach((c,x)=>{const a=ang+x*2*Math.PI/n,d=(Math.cos(a)+1)/2,s=(.6+.4*d)*(x==hv?1.14:1);
c.style.transform=`translate(${cx+rx*Math.sin(a)}px,${cy+ry*Math.cos(a)}px) translate(-50%,-50%) scale(${s})`;
c.style.opacity=x==hv?1:.4+.6*d;c.style.zIndex=x==hv?5:(d>.5?3:1);c.classList.toggle('on',x==hv||(hv<0&&d>.96))})}
function loop(){if(!rm)ang+=.0035;pos();requestAnimationFrame(loop)}

loop();
$('#ckb').onclick=()=>{$('#ck').style.display='none'};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.style.transitionDelay=(t._d||0)+'ms';t.classList.add('in');setTimeout(()=>t.style.transitionDelay='',1500);io.unobserve(t)}}),{threshold:.1});
function reveal(){document.querySelectorAll('main .glass,main h2,main .sub,.chip,details').forEach(el=>{if(el.classList.contains('rvl'))return;el.classList.add('rvl');el._d=Math.min([...el.parentElement.children].indexOf(el),5)*90;io.observe(el)})}
document.querySelectorAll('main section:not(.hero)').forEach((el,x)=>{el.classList.add('sx');if(x%2)el.classList.add('cy')});
document.addEventListener('mousemove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}});
$('#pt').innerHTML=Array.from({length:28},()=>`<i style="left:${Math.random()*100}%;top:${30+Math.random()*70}%;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;animation-duration:${6+Math.random()*9}s;animation-delay:-${Math.random()*12}s"></i>`).join('');
const nb=$('.nums b'),cio=new IntersectionObserver(es=>{if(es[0].isIntersecting){cio.disconnect();const t0=performance.now(),go=t=>{const p=Math.min((t-t0)/1400,1);nb.textContent=Math.max(1,Math.round(2*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(go)};requestAnimationFrame(go)}});cio.observe(nb);
const HX={ro:{a:['Site-uri web','creative și rapide'],b:['Boți Telegram','vânzări automate'],c:['Automatizări AI','economisești timp'],t:['Design adaptiv','Editezi singur','Suport 24/7']},ru:{a:['Веб-сайты','креативно и быстро'],b:['Telegram-боты','автоматические продажи'],c:['ИИ-автоматизация','экономия времени'],t:['Адаптивный дизайн','Редактируете сами','Поддержка 24/7']}};
function hx(){const d=HX[L=='ru'?'ru':'ro'];[['fa','a','◆'],['fb','b','✈'],['fcc','c','✦']].forEach(([id,key,ic])=>{$('#'+id).innerHTML='<i>'+ic+'</i><span><b>'+d[key][0]+'</b><small>'+d[key][1]+'</small></span>'});$('#tk').innerHTML=d.t.map(x=>'<li>'+x+'</li>').join('')}
function spy(){const y=innerHeight*.35;let cur=NAV[0][2];
if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur='#contact';
else NAV.forEach(n=>{const e=document.querySelector(n[2]);if(e&&e.getBoundingClientRect().top<=y)cur=n[2]});
document.querySelectorAll('#nav a,#mnav a:not(.btn)').forEach(a=>{const on=a.getAttribute('href')==cur;a.classList.toggle('on',on);on?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')})}
let sp=0;addEventListener('scroll',()=>{if(!sp){sp=1;requestAnimationFrame(()=>{sp=0;spy()})}},{passive:true});
const bg=$('#bg'),mn=$('#mnav');
function menu(v){mn.classList.toggle('open',v);bg.setAttribute('aria-expanded',v)}
bg.onclick=()=>menu(!mn.classList.contains('open'));
mn.addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
addEventListener('keydown',e=>{if(e.key=='Escape')menu(false)});
addEventListener('resize',()=>{if(innerWidth>1100)menu(false)});
cs.forEach((c,x)=>{c.onmouseenter=()=>hv=x;c.onmouseleave=()=>hv=-1});
render();
</script>
</body>
